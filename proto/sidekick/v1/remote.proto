syntax = "proto3";

// Application protocol spoken between a paired phone and a local bridge.
// Frames are serialized, then end-to-end encrypted; the relay only ever sees
// ciphertext and never decodes these messages.
package sidekick.v1;

option go_package = "github.com/DDGRCF/sidekick.server/gen/go/sidekick/v1;sidekickv1";
option java_multiple_files = true;
option java_package = "dev.ddgrcf.sidekick.proto.v1";

// Current protocol version carried in every Frame.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_1 = 1;
}

message Frame {
  ProtocolVersion version = 1;
  // Request id, unique per sender and monotonically increasing. 0 for events.
  uint64 id = 2;
  // Id of the request this frame answers. 0 for requests and events.
  uint64 reply_to = 3;

  oneof body {
    Hello hello = 10;
    Error error = 11;
    Ack ack = 12;

    ListSessionsRequest list_sessions = 20;
    ListSessionsResponse sessions = 21;
    ListHistoryRequest list_history = 22;
    ListHistoryResponse history = 23;
    GetMessagesRequest get_messages = 24;
    GetMessagesResponse messages = 25;

    SubscribeRequest subscribe = 30;
    UnsubscribeRequest unsubscribe = 31;
    SessionEvent event = 32;

    InputRequest input = 40;
    KeysRequest keys = 41;
    StartSessionRequest start_session = 42;
    StartSessionResponse session_started = 43;
    StopSessionRequest stop_session = 44;

    Presence presence = 50;
    GetMediaRequest get_media = 51;
    GetMediaResponse media = 52;
    ListFilesRequest list_files = 53;
    ListFilesResponse files = 54;
    ListCommandsRequest list_commands = 55;
    ListCommandsResponse commands = 56;
    UploadMediaRequest upload_media = 57;
    UploadMediaResponse upload_media_resp = 58;
    HandoverSessionRequest handover_session = 59;
    HandoverSessionResponse handover_session_resp = 60;
    GetSessionConfigRequest get_session_config = 61;
    SessionConfig session_config = 62;
    SetSessionConfigRequest set_session_config = 63;
    RespondRuntimeRequest respond_runtime_request = 64;
    InterruptTurnRequest interrupt_turn = 65;
    GetWorkspaceContextRequest get_workspace_context = 66;
    WorkspaceContext workspace_context = 67;
    OpenInNvimRequest open_in_nvim = 68;
    OpenInNvimResponse open_in_nvim_resp = 69;
  }
}

// Sent by both sides right after the encrypted channel is established.
message Hello {
  // e.g. "sidekick-bridge/0.1.0" or "sidekick-android/0.1.0".
  string agent = 1;
  repeated string capabilities = 2;
  // Bridge only: tools the phone may start and their abilities.
  repeated ToolInfo tools = 3;
  // Bridge only: allow-listed working directories.
  repeated Workspace workspaces = 4;
}

message ToolInfo {
  // sidekick tool name: "codex", "claude", "pi", "devin", "antigravity".
  string name = 1;
  bool installed = 2;
  // True when GetMessages can return structured messages for this tool.
  // False means only the SCREEN stream is available.
  bool structured_history = 3;
}

message Workspace {
  string cwd = 1;
  string name = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_UNAVAILABLE = 4;
  ERROR_CODE_UNSUPPORTED = 5;
  ERROR_CODE_INTERNAL = 6;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message Ack {}

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_TMUX = 1;
  BACKEND_ZELLIJ = 2;
  BACKEND_RPC = 3;
}

// Provider-native conversation identity. Provider-private metadata
// (file paths etc.) never leaves the bridge.
message Conversation {
  string id = 1;
  string provider = 2;
  bool resumable = 3;
}

// A live (or recently live) multiplexer session running a sidekick tool.
message Session {
  // Multiplexer session name, i.e. sidekick's sid:
  // "<tool> <sha256(cwd) prefix>[ <instance_id>]".
  string id = 1;
  string tool = 2;
  string cwd = 3;
  string instance_id = 4;
  string title = 5;
  Conversation conversation = 6;
  Backend backend = 7;
  // The multiplexer session currently exists.
  bool live = 8;
  // A local client (Neovim terminal or mux client) is attached right now.
  bool attached_locally = 9;
  int64 last_activity_unix_ms = 10;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// A stored provider conversation, live or not.
message HistoryEntry {
  Conversation conversation = 1;
  string tool = 2;
  string cwd = 3;
  string title = 4;
  int64 created_unix_ms = 5;
  int64 updated_unix_ms = 6;
  uint32 message_count = 7;
  // Short plain-text preview of the last user or assistant message.
  string preview = 8;
  // Id of the live Session currently running this conversation, if any.
  string session_id = 9;
}

message ListHistoryRequest {
  // Optional filters; empty means all.
  string tool = 1;
  string cwd = 2;
  // Defaults to 50, capped at 200 by the bridge.
  uint32 limit = 3;
  string page_token = 4;
}

message ListHistoryResponse {
  // Sorted by updated_unix_ms descending.
  repeated HistoryEntry entries = 1;
  string next_page_token = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
  ROLE_SYSTEM = 3;
  ROLE_TOOL = 4;
}

enum ToolCallStatus {
  TOOL_CALL_STATUS_UNSPECIFIED = 0;
  TOOL_CALL_STATUS_PENDING = 1;
  TOOL_CALL_STATUS_RUNNING = 2;
  TOOL_CALL_STATUS_COMPLETED = 3;
  TOOL_CALL_STATUS_FAILED = 4;
}

message TextPart {
  // Markdown.
  string text = 1;
}

message ThinkingPart {
  string text = 1;
}

message ToolCallPart {
  string call_id = 1;
  string name = 2;
  // Raw JSON arguments as emitted by the provider.
  string input_json = 3;
  ToolCallStatus status = 4;
}

message ToolResultPart {
  string call_id = 1;
  // Possibly truncated by the bridge.
  string output = 2;
  bool is_error = 3;
  bool truncated = 4;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
}

message MediaPart {
  string media_id = 1;
  MediaKind kind = 2;
  string mime_type = 3;
  string filename = 4;
  uint64 size_bytes = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint64 duration_ms = 8;
  bytes sha256_plain = 9;
  bytes thumbnail = 10;
}

message Part {
  oneof kind {
    TextPart text = 1;
    ThinkingPart thinking = 2;
    ToolCallPart tool_call = 3;
    ToolResultPart tool_result = 4;
    MediaPart media = 5;
  }
}

message GetMediaRequest {
  string media_id = 1;
  uint64 offset = 2;
  uint32 limit = 3;
}

message GetMediaResponse {
  string media_id = 1;
  string mime_type = 2;
  bytes data = 3;
  uint64 total_size = 4;
  uint64 next_offset = 5;
  bool eof = 6;
  bytes sha256_plain = 7;
}

message UploadMediaRequest {
  string upload_id = 1;
  string session_id = 2;
  MediaKind kind = 3;
  string mime_type = 4;
  string filename = 5;
  uint64 total_size = 6;
  uint64 offset = 7;
  bytes data = 8;
  bool eof = 9;
  bytes sha256_plain = 10;
}

message UploadMediaResponse {
  string upload_id = 1;
  uint64 next_offset = 2;
  bool committed = 3;
  string rel_path = 4;
  bytes sha256_plain = 5;
}

message HandoverSessionRequest {
  string source_session_id = 1;
  string target_tool = 2;
  string target_session_id = 3;
  string cwd = 4;
  string handover_note = 5;
  bool include_context = 6;
}

message HandoverSessionResponse {
  Session target_session = 1;
  string handed_over_prompt = 2;
}

// Normalized message on the main chain of a conversation.
message Message {
  // Bridge-assigned position on the main chain, starting at 1. Stable for a
  // given conversation as long as the provider does not rewrite history.
  uint64 seq = 1;
  // Provider-native message id when available.
  string id = 2;
  Role role = 3;
  repeated Part parts = 4;
  int64 created_unix_ms = 5;
  string model = 6;
}

message GetMessagesRequest {
  string tool = 1;
  string conversation_id = 2;
  // Return messages with seq > after_seq.
  uint64 after_seq = 3;
  // Defaults to 100, capped at 500 by the bridge.
  uint32 limit = 4;
}

message GetMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
  // Set when the provider rewrote history (e.g. compaction): the client must
  // drop its cache for this conversation and refetch from after_seq = 0.
  bool reset = 3;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  // Structured messages; requires ToolInfo.structured_history.
  STREAM_MESSAGES = 1;
  // Rendered terminal screen.
  STREAM_SCREEN = 2;
}

message SubscribeRequest {
  string session_id = 1;
  repeated Stream streams = 2;
  // For STREAM_MESSAGES: resume after this seq.
  uint64 after_seq = 3;
}

message UnsubscribeRequest {
  string session_id = 1;
}

// Terminal screen snapshot. v1 always sends full snapshots, throttled by the
// bridge; incremental updates may be added in a later version.
message Screen {
  uint64 revision = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  // Visible pane plus scrollback, with ANSI SGR escapes (tmux capture-pane -e).
  bytes ansi = 4;
  uint32 cursor_row = 5;
  uint32 cursor_col = 6;
}

message SessionClosed {
  string reason = 1;
}

message StreamingDraft {
  // True while the agent is actively streaming output before the final structured turn commits.
  bool active = 1;
  // Clean incremental response text/Markdown extracted for live Chat display.
  string text = 2;
  // Optional model/tool identifier for the active speaker.
  string model = 3;
  // Live incremental reasoning/thinking text while the model is thinking.
  string thinking = 4;
  // Short human-readable activity label (e.g. "思考中…", "正在运行工具 bash…").
  string status = 5;
}

message InteractiveDialogOption {
  string label = 1;
  string description = 2;
  bool selected = 3;
  bool current = 4;
}

// InteractiveDialog describes a secondary TUI popup/selector (e.g. /model, /thinking,
// permission confirmation, or interactive picker) rendered natively in Chat.
message InteractiveDialog {
  bool open = 1;
  // "model", "thinking", "select", "confirm", "permission", "input", "menu"
  string kind = 2;
  string title = 3;
  string subtitle = 4;
  string query = 5;
  repeated InteractiveDialogOption options = 6;
  int32 selected_index = 7;
  string hint = 8;
  bool searchable = 9;
}

message SessionEvent {
  string session_id = 1;
  oneof kind {
    Message message = 10;
    Screen screen = 11;
    // Metadata changed (title, conversation, attached_locally, ...).
    Session updated = 12;
    SessionClosed closed = 13;
    // Same semantics as GetMessagesResponse.reset.
    bool reset = 14;
    // Live incremental assistant draft before the final structured Message commits.
    StreamingDraft draft = 15;
    // Live secondary interactive dialog (/model, /thinking, permission prompt, etc.).
    InteractiveDialog dialog = 16;
    // Updated native RPC session config (model, thinking level, runtime mode, running state).
    SessionConfig config_updated = 17;
    // Blocking interactive request (tool approval or structured user input) from native RPC runtime.
    RuntimeRequest runtime_request = 18;
  }
}

message InputRequest {
  string session_id = 1;
  // Pasted as-is (bracketed paste), never interpreted as key names.
  string text = 2;
  // Press Enter after pasting.
  bool submit = 3;
}

// Allow-listed special keys; arbitrary key names are never accepted.
enum Key {
  KEY_UNSPECIFIED = 0;
  KEY_ENTER = 1;
  KEY_ESCAPE = 2;
  KEY_TAB = 3;
  KEY_SHIFT_TAB = 4;
  KEY_BACKSPACE = 5;
  KEY_UP = 6;
  KEY_DOWN = 7;
  KEY_LEFT = 8;
  KEY_RIGHT = 9;
  KEY_CTRL_C = 10;
  KEY_CTRL_D = 11;
}

message KeysRequest {
  string session_id = 1;
  repeated Key keys = 2;
}

message StartSessionRequest {
  string tool = 1;
  // Must be inside an allow-listed Workspace.
  string cwd = 2;
  // Optional provider conversation to resume.
  string resume_conversation_id = 3;
}

message StartSessionResponse {
  Session session = 1;
}

message StopSessionRequest {
  string session_id = 1;
}

enum PresenceSource {
  PRESENCE_SOURCE_UNSPECIFIED = 0;
  PRESENCE_SOURCE_LOCAL = 1;
  PRESENCE_SOURCE_REMOTE = 2;
}

// Lets each side show "typing on the other device" to avoid interleaved input.
message Presence {
  string session_id = 1;
  PresenceSource source = 2;
  bool typing = 3;
}

message ListFilesRequest {
  // Preferred: resolve cwd from session. If empty, cwd must fall inside allow-listed workspaces.
  string session_id = 1;
  string cwd = 2;
  string query = 3;
  uint32 limit = 4;
}

message FileEntry {
  string rel_path = 1;
  bool is_dir = 2;
  uint64 size_bytes = 3;
}

message ListFilesResponse {
  string root_cwd = 1;
  repeated FileEntry files = 2;
  bool truncated = 3;
}

enum SlashCommandSource {
  SLASH_COMMAND_SOURCE_UNSPECIFIED = 0;
  SLASH_COMMAND_SOURCE_BUILTIN = 1;
  SLASH_COMMAND_SOURCE_SKILL = 2;
  SLASH_COMMAND_SOURCE_PROJECT = 3;
  SLASH_COMMAND_SOURCE_USER = 4;
  SLASH_COMMAND_SOURCE_PLUGIN = 5;
}

message SlashCommand {
  string name = 1;
  string description = 2;
  string args_hint = 3;
  SlashCommandSource source = 4;
}

message ListCommandsRequest {
  string session_id = 1;
  string tool = 2;
  string cwd = 3;
}

message ListCommandsResponse {
  repeated SlashCommand commands = 1;
}

message ModelOption {
  string id = 1;
  string provider = 2;
  string name = 3;
  bool reasoning = 4;
  repeated string thinking_levels = 5;
  bool current = 6;
}

enum RuntimeMode {
  RUNTIME_MODE_UNSPECIFIED = 0;
  RUNTIME_MODE_APPROVAL_REQUIRED = 1;
  RUNTIME_MODE_AUTO_ACCEPT_EDITS = 2;
  RUNTIME_MODE_AUTO = 3;
  RUNTIME_MODE_FULL_ACCESS = 4;
}

message SessionConfig {
  string session_id = 1;
  string model = 2;
  string thinking_level = 3;
  RuntimeMode runtime_mode = 4;
  repeated ModelOption available_models = 5;
  repeated string available_thinking_levels = 6;
  repeated RuntimeMode supported_runtime_modes = 7;
  bool supports_mid_turn_config = 8;
  bool supports_steer = 9;
  bool supports_interrupt = 10;
  bool is_running = 11;
}

message GetSessionConfigRequest {
  string session_id = 1;
}

message SetSessionConfigRequest {
  string session_id = 1;
  string model = 2;
  string thinking_level = 3;
  RuntimeMode runtime_mode = 4;
}

enum RuntimeRequestKind {
  RUNTIME_REQUEST_KIND_UNSPECIFIED = 0;
  RUNTIME_REQUEST_KIND_APPROVAL = 1;
  RUNTIME_REQUEST_KIND_USER_INPUT = 2;
}

message RuntimeRequestOption {
  string id = 1;
  string label = 2;
  string description = 3;
  string preview = 4;
}

message RuntimeQuestion {
  string id = 1;
  string header = 2;
  string question = 3;
  repeated RuntimeRequestOption options = 4;
  bool multi_select = 5;
  bool allow_custom_answer = 6;
}

message RuntimeRequest {
  string request_id = 1;
  RuntimeRequestKind kind = 2;
  bool resolved = 3;
  string title = 4;
  string detail = 5;
  string tool_name = 6;
  repeated RuntimeRequestOption approval_options = 7;
  repeated RuntimeQuestion questions = 8;
  bool dismissible = 9;
}

message RuntimeAnswer {
  string question_id = 1;
  repeated string selected_values = 2;
  string custom_text = 3;
}

message RespondRuntimeRequest {
  string session_id = 1;
  string request_id = 2;
  string decision = 3;
  string feedback = 4;
  repeated RuntimeAnswer answers = 5;
  bool cancelled = 6;
}

message InterruptTurnRequest {
  string session_id = 1;
}

message ChangedFile {
  string path = 1;
  string status = 2; // "M", "A", "D", "R", "??"
  int32 added = 3;
  int32 removed = 4;
}

message DiagnosticItem {
  string file = 1;
  uint32 line = 2;
  uint32 col = 3;
  string severity = 4; // "error", "warn", "info", "hint"
  string message = 5;
  string source = 6;
}

message GetWorkspaceContextRequest {
  string session_id = 1;
  string cwd = 2;
  bool include_diff = 3;
}

message WorkspaceContext {
  string cwd = 1;
  string git_branch = 2;
  repeated ChangedFile changed_files = 3;
  string git_diff = 4;
  bool nvim_connected = 5;
  string nvim_server = 6;
  string nvim_file = 7;
  uint32 nvim_line = 8;
  repeated DiagnosticItem diagnostics = 9;
  repeated string open_buffers = 10;
}

message OpenInNvimRequest {
  string session_id = 1;
  string tool = 2;
  string cwd = 3;
  string conversation_id = 4;
  bool stop_remote_rpc = 5;
}

message OpenInNvimResponse {
  bool opened = 1;
  string nvim_server = 2;
  string resume_command = 3;
  string message = 4;
}
